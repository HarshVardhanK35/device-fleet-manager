name: Promote to Production

# Fires on a version tag (e.g. v1.0.0). Copies the exact image that
# build-and-push.yml already built and staging already tested — tagged
# "staging" — to a "prod" tag, with no rebuild. Then tells Render to
# redeploy dfm-api using that image. The frontend (dfm) is a
# Render Static Site, which can't deploy from a pre-built image, so it
# still rebuilds from source via its own deploy hook — that's a Render
# product limitation, not something this workflow can avoid.
on:
  push:
    tags:
      - "v*"

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote backend image (staging -> prod, no rebuild)
        run: >
          docker buildx imagetools create
          --tag ghcr.io/harshvardhank35/dfm-api:prod
          ghcr.io/harshvardhank35/dfm-api:staging

      - name: Redeploy backend on Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Deploy frontend (rebuilds from source — Static Sites can't use images)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
