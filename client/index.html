<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CastWise – Free digital signage for any screen</title>
  <meta name="description"
    content="Free digital signage for up to 3 screens. Show images, videos and notices on any TV, tablet or phone with a browser, set up in minutes." />

  <!-- The official address of this page, so Google counts every other address
       (www, staging, ?tracking) as copies of it. -->
  <link rel="canonical" href="https://castwise.site/" />

  <!-- What a pasted link looks like in WhatsApp, LinkedIn, Slack, Facebook.
       No og:image yet: add a 1200x630 picture here when there is one. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CastWise" />
  <meta property="og:url" content="https://castwise.site/" />
  <meta property="og:title" content="CastWise – Free digital signage for any screen" />
  <meta property="og:description"
    content="Free digital signage for up to 3 screens. Show images, videos and notices on any TV, tablet or phone with a browser, set up in minutes." />

  <!-- Same, for X (Twitter). "summary" until there is a share picture, then
       switch to "summary_large_image". -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="CastWise – Free digital signage for any screen" />
  <meta name="twitter:description"
    content="Free digital signage for up to 3 screens. Show images, videos and notices on any TV, tablet or phone with a browser, set up in minutes." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
