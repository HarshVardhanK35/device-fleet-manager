<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- The SVG is for browsers; the PNGs (48 and 192 px, multiples of 48 as Google
       asks) and favicon.ico are for Google Search and older crawlers. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CastWise – Free digital signage for any screen</title>
  <meta name="description"
    content="Free digital signage for up to 3 screens. Show images, videos and notices on any TV, tablet or phone with a browser, set up in minutes." />

  <!-- The official address of this page, so Google counts every other address
       (www, staging, ?tracking) as copies of it. -->
  <link rel="canonical" href="https://castwise.site/" />

  <!-- What a pasted link looks like in WhatsApp, LinkedIn, Slack, Facebook. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CastWise" />
  <meta property="og:url" content="https://castwise.site/" />
  <meta property="og:image" content="https://castwise.site/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="CastWise: turn any screen into something people read" />
  <meta property="og:title" content="CastWise – Free digital signage for any screen" />
  <meta property="og:description"
    content="Free digital signage for up to 3 screens. Show images, videos and notices on any TV, tablet or phone with a browser, set up in minutes." />

  <!-- Same, for X (Twitter). -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://castwise.site/og-image.png" />
  <meta name="twitter:title" content="CastWise – Free digital signage for any screen" />
  <meta name="twitter:description"
    content="Free digital signage for up to 3 screens. Show images, videos and notices on any TV, tablet or phone with a browser, set up in minutes." />

  <!-- Tells Google what CastWise is and where its official pages are. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://castwise.site/#organization",
        "name": "CastWise",
        "url": "https://castwise.site/",
        "logo": "https://castwise.site/favicon-192.png",
        "email": "hello@castwise.site",
        "sameAs": [
          "https://www.linkedin.com/company/cast-wise",
          "https://github.com/cast-wise",
          "https://x.com/castwisehq"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://castwise.site/#website",
        "name": "CastWise",
        "url": "https://castwise.site/",
        "publisher": { "@id": "https://castwise.site/#organization" }
      },
      {
        "@type": "SoftwareApplication",
        "name": "CastWise",
        "url": "https://castwise.site/",
        "description": "Free digital signage for up to 3 screens. Show images, videos and notices on any TV, tablet or phone with a browser.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any device with a web browser",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": { "@id": "https://castwise.site/#organization" }
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Safety net for a browser too old to run the app: if nothing has appeared after
       12 seconds, say so plainly (plain ES5 on purpose). -->
  <script>
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && !root.firstChild) {
        var m = navigator.userAgent.match(/Chrom(?:e|ium)/(d+)/);
        root.innerHTML =
          "<div style=\"font:20px Arial,sans-serif;color:#e6edf3;background:#0d1117;min-height:100vh;padding:6vmin\">" +
          "<h1 style=\"font-size:1.6em\">CastWise could not start</h1>" +
          "<p>Check the internet connection and reload. If it keeps happening, this browser may be too old: update the TV firmware or use a newer browser.</p>" +
          "<p style=\"opacity:.7\">Browser: " + (m ? "Chromium " + m[1] : navigator.userAgent) + "</p></div>";
      }
    }, 12000);
  </script>
</body>

</html>
